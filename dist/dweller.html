<script>/* DWELLER — simulation core. Pure logic, no DOM: runs in the browser and in Node (for the test bot).
 *
 * Resonance with The Seeker: the simulation ticks at 96 Hz, animation steps at 12 fps (8 ticks),
 * the tempo is 90 BPM (one beat = 64 ticks), tiles are 6 px and the Seeker is two tiles tall.
 * Every light that pulses does so on whole beats. Running speed is exactly 8 tiles per beat.
 */
(function (global) {
  'use strict';

  const C = {
    W: 5, H: 10, HR: 5,                      // hitbox: standing 5x10, rolling 5x5
    RUN: 72, CRAWL: 46,
    GACC: 1100, GFRIC: 1500, AACC: 760, AFRIC: 420,
    JUMPV: 150, GU: 540, GD: 650, CUT: 2.7, MAXFALL: 215, APEXV: 26, APEXG: 0.62,
    COYOTE: 9, BUFFER: 10,
    WSLIDE: 34, WJX: 86, WJY: 144, WLOCK: 11, WCOY: 7,
    ROLLV: 108, ROLLT: 33, ROLLCD: 20,
    BURN: 0.95, REGEN: 0.9, DEADT: 104, GRACE: 64,
    LITLO: 0.10, LITHI: 0.50,
    // the SEEKER companion: flies to a light and covers it (an eclipse)
    CMPV: 2.9, CMPHOLD: 480, CMPCD: 224, CMPR: 120,
    // terrain features of the deeper levels
    BOUNCE: 262, ICEACC: 0.16, ICEFRIC: 0.06, CLIMBUP: 44, CLIMBDN: 80, SHIMMY: 38,
    VENTACC: 1500, VENTMAX: 150, DROP: 10,
  };
  const TT = { ONEWAY: 1, BOUNCE: 2, ICE: 3 };

  const EPS = 1e-4;

  function smooth(e0, e1, x) {

  /* ------------------------------------------------------------------ world */

  function decodeRows(level) {
    const W = level.w, H = level.h;
    const solid = new Uint8Array(W * H);

      let x = 0, v = 0;           // runs alternate: air, rock, air, rock...
      for (let i = 0; i < runs.length; i++) {
        const n = runs[i];
        if (v) solid.fill(1, y * W + x, y * W + x + n);
        x += n; v ^= 1;

    return solid;
  }

  function makeWorld(level) {
    const w = {

      killY: level.h * TS + 40,
      lights: [], hazards: [],
      checks: level.checks.map(c => ({ x: c.x, y: c.y, i: c.i })),
      goal: level.goal, spawn: level.spawn, kills: level.kills || [],
      sections: level.sections, hints: level.hints, level,
      fakes: level.fakes || [], secret: level.secret || null,
      tt: new Uint8Array(level.w * level.h), vine: new Uint8Array(level.w * level.h), vent: new Uint8Array(level.w * level.h),
      switches: (level.switches || []).map((q, i) => Object.assign({ i }, q)),
    };
    const T = level.tiles || {};
    const put = (arr, v, runs) => (runs || []).forEach(([x, y, n, h]) => { for (let yy = y; yy < y + (h || 1); yy++) for (let xx = x; xx < x + n; xx++) if (xx >= 0 && yy >= 0 && xx < w.W && yy < w.H) arr[yy * w.W + xx] = v; });
    put(w.tt, TT.ONEWAY, T.oneway); put(w.tt, TT.BOUNCE, T.bounce); put(w.tt, TT.ICE, T.ice);
    put(w.vine, 1, level.vines); put(w.vent, 1, level.vents);
    w.hasOneway = !!(T.oneway && T.oneway.length); w.hasVine = !!(level.vines && level.vines.length);
    w.hasVent = !!(level.vents && level.vents.length); w.hasTT = !!(T.bounce && T.bounce.length) || !!(T.ice && T.ice.length);
    level.lights.forEach((d, i) => {

  function ttAt(w, tx, ty) { return tx < 0 || ty < 0 || tx >= w.W || ty >= w.H ? 0 : w.tt[ty * w.W + tx]; }
  /* one-way shelves: only the tile row exactly under the feet counts, and only from above */
  function onOneway(w, s) {
    if (!w.hasOneway || s.drop > 0) return false;
    const b = s.y + s.h, ty = Math.round(b / TS);

    const x0 = Math.floor(s.x / TS), x1 = Math.floor((s.x + C.W - EPS) / TS);
    return ttAt(w, x0, ty) || ttAt(w, x1, ty);
  }

    const tx = Math.floor((s.x + C.W / 2) / TS), ty = Math.floor((s.y + s.h / 2) / TS);

  }

  function solidAt(w, tx, ty) {
    if (tx < 0 || ty < 0 || tx >= w.W) return true;
    if (ty >= w.H) return false;      // below the map is open void
    return w.solid[ty * w.W + tx] === 1;
  }

  function rectSolid(w, x, y, ww, hh) {
    const x0 = Math.floor(x / TS), x1 = Math.floor((x + ww - EPS) / TS);
    const y0 = Math.floor(y / TS), y1 = Math.floor((y + hh - EPS) / TS);
    for (let ty = y0; ty <= y1; ty++)
      for (let tx = x0; tx <= x1; tx++)
        if (solidAt(w, tx, ty)) return true;
    return false;
  }

  /* Distance along a ray to the first solid tile (Amanatides & Woo). maxD in px. */
  function castRay(w, ox, oy, dx, dy, maxD) {
    let tx = Math.floor(ox / TS), ty = Math.floor(oy / TS);
    const sx = dx > 0 ? 1 : -1, sy = dy > 0 ? 1 : -1;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    const tdx = adx < 1e-9 ? 1e30 : TS / adx, tdy = ady < 1e-9 ? 1e30 : TS / ady;
    let tmx = adx < 1e-9 ? 1e30 : ((dx > 0 ? (tx + 1) * TS - ox : ox - tx * TS) / adx);
    let tmy = ady < 1e-9 ? 1e30 : ((dy > 0 ? (ty + 1) * TS - oy : oy - ty * TS) / ady);
    let t = 0;
    for (let i = 0; i < 400; i++) {

      if (t >= maxD) return maxD;
      if (solidAt(w, tx, ty)) return t;
    }
    return maxD;
  }

  function rayClear(w, x0, y0, x1, y1) {
    const dx = x1 - x0, dy = y1 - y0;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d < 0.5) return true;
    return castRay(w, x0, y0, dx / d, dy / d, d) >= d - 0.01;

  /* -------------------------------------------------------------- lights */

  const RISE = 8, FALL = 14;

  function schedGain(s, t) {

    const warn = s.warn === undefined ? 48 : s.warn;

      if (tau < RISE) k = smooth(0, RISE, tau);
      else if (tau > s.len - FALL) k = 1 - smooth(s.len - FALL, s.len, tau);
      return k;
    }

      return 0.07 + 0.045 * Math.sin(q * 0.55) * Math.sin(q * 0.23 + 1);
    }
    return 0;

      const m = l.move;

        if (m.k === 'ellipse') {

          const s = 0.5 - 0.5 * Math.cos(ph);
          l.x = l.bx + m.dx * s; l.y = l.by + m.dy * s;
        }
      }
      if (l.t === 'watch') {
        const ph = (t / l.per + (l.ph || 0)) * Math.PI * 2;
        l.ang = l.spin ? l.base + ph : l.base + l.amp * Math.sin(ph);
      }
    }

  /* Light intensity at a point, 0..1, occlusion included. */
  function lightAt(w, l, px, py) {

      const s = rx * l.dx + ry * l.dy, v = rx * l.nx + ry * l.ny;
      const hw = l.w / 2;

    let f = 1 - smooth(0.30 * l.r, l.r, d);

      da = Math.abs(Math.atan2(Math.sin(da), Math.cos(da)));
      if (da > l.half) return 0;
      f *= 1 - smooth(0.62 * l.half, l.half, da);
      f *= 1 - 0.0 * d;
    }
    if (f <= 0.001) return 0;
    if (!rayClear(w, l.x, l.y, px, py)) return 0;
    return l.I * l.k * f;
  }

        x.fillStyle = col[i % 2]; const cx = (i + 0.5) * W / 7 + (r() - 0.5) * 30, top = H * (0.25 + r() * 0.3), cw = 30 + r() * 34, sw = 5 + r() * 6;
        x.fillRect(cx - sw / 2, top, sw, H - top);
        x.beginPath(); x.ellipse(cx, top, cw, 10 + r() * 10, 0, Math.PI, 0); x.fill();
        x.fillRect(cx - cw, top - 1, cw * 2, 3);
      } else if (kind === 1) for (let i = 0; i < 30; i++) {     // hanging mycelium threads
        x.fillStyle = col[0]; const px = Math.floor(r() * W), len = 20 + r() * 110;
        x.fillRect(px, 0, 1 + (r() < 0.3 ? 1 : 0), len);
        x.beginPath(); x.arc(px + 0.5, len, 2 + r() * 3, 0, Math.PI * 2); x.fill();
        const px2 = Math.floor(r() * W), h2 = 12 + r() * 40;          // little caps rising from below
        x.fillRect(px2, H - h2, 2, h2); x.beginPath(); x.ellipse(px2 + 1, H - h2, 6 + r() * 6, 4, 0, Math.PI, 0); x.fill();
      } else for (let i = 0; i < 8; i++) {
        x.fillStyle = col[0]; const px = Math.floor(r() * W), wd = 3 + r() * 4;
        x.fillRect(px, H - 40 - r() * 90, wd, 200);
        x.fillRect(px - 3, 0, wd + 2, 18 + r() * 60);
      }
    } else if (st === 'glass') {
      if (kind === 0) for (let i = 0; i < 11; i++) {            // crystal spires
        x.fillStyle = col[i % 2]; const cx = (i + 0.5) * W / 11 + (r() - 0.5) * 20, top = H * (0.12 + r() * 0.45), hw = 8 + r() * 16;
        x.beginPath(); x.moveTo(cx - hw, H); x.lineTo(cx - hw * 0.8, top + hw); x.lineTo(cx, top); x.lineTo(cx + hw * 0.8, top + hw); x.lineTo(cx + hw, H); x.closePath(); x.fill();
      } else if (kind === 1) for (let i = 0; i < 26; i++) {
        x.fillStyle = col[0]; const px = Math.floor(r() * W), len = 18 + r() * 70, wd = 4 + r() * 9, lean = (r() - 0.5) * 18;
        tri(px - wd, 0, px + wd, 0, px + lean, len);
        const p2 = Math.floor(r() * W), l2 = 14 + r() * 50, w2 = 4 + r() * 8;
        tri(p2 - w2, H, p2 + w2, H, p2 - lean, H - l2);
      } else for (let i = 0; i < 9; i++) {
        x.fillStyle = col[0]; const px = Math.floor(r() * W), wd = 2 + r() * 4, l = H * (0.2 + r() * 0.5);
        tri(px - wd, 0, px + wd, 0, px, l); tri(px - wd, H, px + wd, H, px + 2, H - l * 0.8);
      }
    } else if (st === 'foundry') {
      if (kind === 0) {                                          // cog wheels and arches
        for (let i = 0; i < 6; i++) {
          x.fillStyle = col[i % 2]; const cx = (i + 0.5) * W / 6 + (r() - 0.5) * 30, cy = H * (0.35 + r() * 0.4), R0 = 18 + r() * 22;
          x.beginPath(); x.arc(cx, cy, R0, 0, Math.PI * 2); x.fill();
          for (let k = 0; k < 10; k++) { const a = k / 10 * Math.PI * 2; x.save(); x.translate(cx + Math.cos(a) * R0, cy + Math.sin(a) * R0); x.rotate(a); x.fillRect(-3, -4, 7, 8); x.restore(); }
          x.fillRect(cx - 3, cy, 6, H - cy);

      } else if (kind === 1) for (let i = 0; i < 14; i++) {     // pipes and chains
        x.fillStyle = col[0]; const py = Math.floor(r() * H * 0.6), px = Math.floor(r() * W), ln = 40 + r() * 140;
        x.fillRect(px, py, ln, 4); x.fillRect(px, py, 4, H - py); x.fillRect(px + ln - 4, py - 30 - r() * 60, 4, 34 + r() * 60);
        const cx2 = Math.floor(r() * W); for (let k = 0; k < 10 + r() * 14; k++) x.fillRect(cx2 + (k % 2), k * 4, 2, 3);
      } else for (let i = 0; i < 7; i++) {                       // girders
        x.fillStyle = col[0]; const px = Math.floor(r() * W);
        x.fillRect(px, 0, 3, H); x.fillRect(px + 9, 0, 3, H);
        for (let k = 0; k < H; k += 16) { x.fillRect(px, k, 12, 2); }

      if (kind === 0) {                                          // jagged ridges
        for (let i = 0; i < 2; i++) {
          x.fillStyle = col[i]; x.beginPath(); x.moveTo(0, H);
          for (let px = 0; px <= W; px += 12) x.lineTo(px, H * (0.35 + 0.25 * i) + (r() - 0.3) * 60);
          x.lineTo(W, H); x.closePath(); x.fill();
        }
      } else if (kind === 1) for (let i = 0; i < 30; i++) {
        x.fillStyle = col[0]; const px = Math.floor(r() * W), len = 20 + r() * 100, wd = 3 + r() * 8;
        tri(px - wd, 0, px + wd, 0, px + (r() - 0.5) * 4, len);
        const p2 = Math.floor(r() * W), l2 = 10 + r() * 60;
        tri(p2 - wd, H, p2 + wd, H, p2, H - l2);
      } else for (let i = 0; i < 10; i++) {
        x.fillStyle = col[0]; const px = Math.floor(r() * W), wd = 3 + r() * 6;
        tri(px - wd, 0, px + wd, 0, px, H * (0.3 + r() * 0.5)); x.fillRect(px - 1, H - 30 - r() * 80, wd, 200);
      }
    } else {                                                     // heart: ribs, veins, tendons
      if (kind === 0) for (let i = 0; i < 5; i++) {
        x.strokeStyle = col[i % 2]; x.lineWidth = 7 + r() * 6; const cx = (i + 0.5) * W / 5, cy = H * (0.9 + r() * 0.2), R0 = 60 + r() * 60;
        x.beginPath(); x.arc(cx, cy, R0, Math.PI * 1.05, Math.PI * 1.95); x.stroke();
        x.lineWidth = 4; x.beginPath(); x.arc(cx, cy, R0 * 0.62, Math.PI * 1.1, Math.PI * 1.9); x.stroke();
      } else if (kind === 1) for (let i = 0; i < 16; i++) {

        x.beginPath(); x.moveTo(px, py);

        x.stroke(); x.fillStyle = col[0]; x.beginPath(); x.arc(px, py, 2 + r() * 2, 0, Math.PI * 2); x.fill();
      } else for (let i = 0; i < 8; i++) {
        x.fillStyle = col[0]; const px = Math.floor(r() * W), wd = 4 + r() * 5;
        x.beginPath(); x.ellipse(px, H, wd, H * (0.3 + r() * 0.4), 0, 0, Math.PI * 2); x.fill();
        x.beginPath(); x.ellipse(px + 30, 0, wd * 0.8, H * (0.15 + r() * 0.3), 0, 0, Math.PI * 2); x.fill();
      }
    }
  }

  function prepare(w, themeName, idx) {
    TH = THEMES[themeName] || THEMES.descent; levelIdx = idx || 0; shardCol = SHARDS[levelIdx] || SHARDS[0];
    tileFlip = themeTiles(TH); SHEETS.orbT = themeOrb(TH);
    const baked = IMG['terrain' + (levelIdx + 1)];
    if (!baked || baked.width !== w.W || baked.height !== w.H) throw new Error('the baked terrain is for another level: run tools/bake_levels.cjs');
    cellsW = baked.width; cellsH = baked.height;
    cells = baked.getContext('2d').getImageData(0, 0, cellsW, cellsH).data;
    w.fakeMask = new Uint8Array(w.W * w.H);
    for (const f of w.fakes) for (let y = f[1]; y < f[1] + f[3]; y++) for (let x = f[0]; x < f[0] + f[2]; x++) if (x >= 0 && y >= 0 && x < w.W && y < w.H) w.fakeMask[y * w.W + x] = 1;
    fakeCv = w.fakes.map(f => {
      const c = document.createElement('canvas'); c.width = (f[2] + 2) * TS; c.height = (f[3] + 2) * TS;
      const x = c.getContext('2d');
      for (let j = -1; j <= f[3]; j++) for (let i = -1; i <= f[2]; i++) drawTerrainTile(x, w, f[0] + i, f[1] + j, (i + 1) * TS, (j + 1) * TS, true);
      return { f, c, a: 1 };
    });
    decor = buildDecor(w);
    bgLayers = [makeBgLayer(11, 512, 300, 0), makeBgLayer(23, 512, 300, 1), makeBgLayer(37, 512, 300, 2)];
    chunks.clear();
  }

  let fakeCv = [];
  function drawFakes(ctx, w, s, camX, camY, dt) {
    const cx = s.x + 2.5, cy = s.y + s.h * 0.5;
    for (const F of fakeCv) {
      const f = F.f, x0 = f[0] * TS, y0 = f[1] * TS, x1 = x0 + f[2] * TS, y1 = y0 + f[3] * TS;
      const inside = cx > x0 - 8 && cx < x1 + 8 && cy > y0 - 8 && cy < y1 + 8;
      F.a += ((inside ? 0.28 : 1) - F.a) * Math.min(1, dt * 6);
      if (x1 < camX - 10 || x0 > camX + 2000 || y1 < camY - 10 || y0 > camY + 2000) continue;
      ctx.globalAlpha = F.a; ctx.drawImage(F.c, Math.round(x0 - TS - camX), Math.round(y0 - TS - camY)); ctx.globalAlpha = 1;
    }
  }

  /* ------------------------------------------------------------------ light mask */
  let lc = null, lctx = null, lw = 0, lh = 0, ldata = null, odata = null, ocv = null, octx = null, oimg = null, o32 = null;
  const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const STOPS = [];
  for (let i = 0; i <= 12; i++) { const u = i / 12; STOPS.push([u, 1 - smooth(0.30, 1, u)]); }

  function ensureLight(W, H) {
    if (lw === W && lh === H) return;
    lw = W; lh = H;
    lc = document.createElement('canvas'); lc.width = W; lc.height = H;
    lctx = lc.getContext('2d', { willReadFrequently: true });
    ocv = document.createElement('canvas'); ocv.width = W; ocv.height = H;
    octx = ocv.getContext('2d');
    oimg = octx.createImageData(W, H); o32 = new Uint32Array(oimg.data.buffer);
  }

  function visPoly(w, ox, oy, r, a0, a1, n) {
    const pts = [];
    const step = (a1 - a0) / n;
    for (let i = 0; i <= n; i++) {
      const a = a0 + step * i, dx = Math.cos(a), dy = Math.sin(a);
      const d = D.castRay(w, ox, oy, dx, dy, r);
      pts.push(ox + dx * (d + 0.6), oy + dy * (d + 0.6));
    }
    return pts;
  }

  function radialGrad(ctx, x, y, r, alpha) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    for (let i = 0; i < STOPS.length; i++) g.addColorStop(STOPS[i][0], 'rgba(255,255,255,' + (STOPS[i][1] * alpha).toFixed(3) + ')');
    return g;
  }

  function fillPoly(ctx, pts, camX, camY, closeToOrigin, ox, oy) {
    ctx.beginPath();
    if (closeToOrigin) ctx.moveTo(ox - camX, oy - camY);
    for (let i = 0; i < pts.length; i += 2) { if (i === 0 && !closeToOrigin) ctx.moveTo(pts[i] - camX, pts[i + 1] - camY); else ctx.lineTo(pts[i] - camX, pts[i + 1] - camY); }
    ctx.closePath(); ctx.fill();
  }

  function drawHazardLight(ctx, w, l, camX, camY, W, H) {
    const rr = l.reach;
    if (l.x + rr < camX || l.x - rr > camX + W || l.y + rr < camY || l.y - rr > camY + H) return;
    const a = l.I * l.k;
    if (a < 0.004) return;
    if (l.t === 'beam') {
      // per-column rays along the beam direction, drawn as a soft rectangle
      const cols = Math.max(4, Math.ceil(l.w / 1.5));
      const hw = l.w / 2;
      const pts = [];
      const far = [];
      for (let i = 0; i <= cols; i++) {
        const v = -hw + (i / cols) * l.w;
        const sx = l.x + l.nx * v, sy = l.y + l.ny * v;
        const d = D.castRay(w, sx, sy, l.dx, l.dy, l.len);
        pts.push(sx, sy); far.push(sx + l.dx * (d + 0.5), sy + l.dy * (d + 0.5));
      }
      for (let layer = 0; layer < 3; layer++) {
        const shrink = [1, 0.84, 0.62][layer], al = [0.34, 0.33, 0.33][layer] * a;
        const poly = [];
        const lo = Math.round((1 - shrink) / 2 * cols), hi = cols - lo;
        for (let i = lo; i <= hi; i++) poly.push(pts[i * 2], pts[i * 2 + 1]);
        for (let i = hi; i >= lo; i--) poly.push(far[i * 2], far[i * 2 + 1]);
        const g = ctx.createLinearGradient(l.x - camX, l.y - camY, l.x + l.dx * l.len - camX, l.y + l.dy * l.len - camY);
        g.addColorStop(0, 'rgba(255,255,255,' + al.toFixed(3) + ')'); g.addColorStop(1, 'rgba(255,255,255,' + (al * 0.55).toFixed(3) + ')');

    }
    if (l.t === 'watch') {
      const n = Math.max(24, Math.round(l.half * 2 * l.r / 5));
      const layers = [[1.0, 0.30], [0.82, 0.34], [0.62, 0.36]];
      for (const [f, al] of layers) {
        const pts = visPoly(w, l.x, l.y, l.r, l.ang - l.half * f, l.ang + l.half * f, n);
        ctx.fillStyle = radialGrad(ctx, l.x - camX, l.y - camY, l.r, al * a);
        fillPoly(ctx, pts, camX, camY, true, l.x, l.y);

      return;
    }

    let pts = l._poly;
    if (!pts || l.move) {
      const n = Math.max(40, Math.min(220, Math.round(l.r * 2.4)));
      pts = visPoly(w, l.x, l.y, l.r, 0, Math.PI * 2, n);
      if (!l.move) l._poly = pts;
    }
    ctx.fillStyle = radialGrad(ctx, l.x - camX, l.y - camY, l.r, a);
    fillPoly(ctx, pts, camX, camY, false);
  }

  function softDisc(ctx, x, y, r, alpha) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, 'rgba(255,255,255,' + alpha + ')'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  /* The darkness pass: builds the light mask, dithers it to a few bands, composites a dark overlay. */
  const AMBIENT = 0.34, STEPS = 9;
  function lightPass(ctx, Gm, camX, camY, W, H) {
    const w = Gm.w, s = Gm.s;
    ensureLight(W, H);
    lctx.globalCompositeOperation = 'source-over'; lctx.fillStyle = '#000'; lctx.fillRect(0, 0, W, H);
    lctx.globalCompositeOperation = 'lighter';
    const lights = w.lights;
    for (let i = 0; i < lights.length; i++) {
      const l = lights[i];
      if (l.hazard) drawHazardLight(lctx, w, l, camX, camY, W, H);
    }
    // gentle lifts: the Dweller sees a little in the dark; tethers and the crystal glow without hurting
    const px = s.x + 2.5, py = s.y + s.h * 0.5;
    softDisc(lctx, px - camX, py - camY, 26, 0.30);
    for (const c of w.checks) {
      if (c.x < camX - 30 || c.x > camX + W + 30) continue;
      softDisc(lctx, c.x - camX, c.y - 12 - camY, c.i <= s.cp ? 30 : 14, c.i <= s.cp ? 0.42 : 0.16);
    }
    const g = w.goal;
    if (g.x > camX - 140 && g.x < camX + W + 140) softDisc(lctx, g.x - camX, g.y - camY, 110, 0.8);
    for (const l of lights) if (!l.hazard && l.col !== 'rainbow' && l.col !== 'shard') { if (l.x > camX - l.r && l.x < camX + W + l.r) softDisc(lctx, l.x - camX, l.y - camY, l.r, 0.5 * l.k); }
    // the hidden seeker leaks a little light through its false wall; the companion glows softly
    if (w.secret && !s.cmp) softDisc(lctx, w.secret.x - camX, w.secret.y - camY, 22, 0.22);
    if (s.cmp) softDisc(lctx, s.cmpX - camX, s.cmpY - camY, 14, 0.18);
    // quantize
    const darkBGR = (TH.dark[2] << 16) | (TH.dark[1] << 8) | TH.dark[0];
    const id = lctx.getImageData(0, 0, W, H); const d = id.data;
    const dark = (0xFF << 24) | (16 << 16) | (8 << 8) | 5;      // ABGR: r=5 g=8 b=16
    let o = 0;
    for (let y = 0; y < H; y++) {
      const by = (y & 3) * 4;
      for (let x = 0; x < W; x++, o++) {
        const i = o * 4;
        let L = d[i]; if (d[i + 1] > L) L = d[i + 1]; if (d[i + 2] > L) L = d[i + 2];
        let q = Math.floor(L / 255 * STEPS + (BAYER[by + (x & 3)] + 0.5) / 16) / STEPS;
        if (q > 1) q = 1;
        const a = 1 - (AMBIENT + (1 - AMBIENT) * q);

      }
    }
    octx.putImageData(oimg, 0, 0);
    ctx.drawImage(ocv, 0, 0);
  }

  /* ------------------------------------------------------------------ sprites in the world */
  /* Frame choice follows The Seeker's own .anim.toml scripts (12 fps, 8 ticks a frame):
   * idle has a left row (flipped) and a right row, each with a landing crouch and a loop;
   * run starts on its second frame (first after a fall or a turn) and loops 3..10;
   * fall has a straight and a sideways version that swap frame for frame. */
  function playerFrame(s) {
    const f = Math.floor(s.anim / 8);
    const loop = (i, start, a, b) => { i += start; return i <= b ? i : a + (i - a) % (b - a + 1); };
    switch (s.st) {
      case 'idle': {
        const land = s.fromSt === 'fall' || s.fromSt === 'jump' || s.fromSt === 'wall';
        if (s.face < 0) return ['idle', loop(f, land ? 0 : 2, 3, 11)];
        return ['idle', loop(f, land ? 12 : 14, 14, 23)];
      }
      case 'run': {
        const turned = s.t - s.faceT <= s.anim;
        const a = turned ? s.t - s.faceT : s.anim;
        const start = turned || s.fromSt === 'fall' ? 0 : 1;
        return ['run', loop(Math.floor(a / 8), start, 2, 9)];
      }
      // frame 1 once, then 2-5 loop; frames 6-12 belong to the double jump
      case 'jump': return ['jump', loop(f, 0, 1, 4)];
      // falling straight: 1-2 lead in, 3-6 loop; drifting sideways: the same phase in frames 7-12
      case 'fall': return ['fall', loop(f, 0, 2, 5) + (Math.abs(s.vx) > 12 ? 6 : 0)];
      // a roll plays once and holds; crawling loops it
      case 'roll': return ['roll', s.roll > 0 ? Math.min(3, f) : f % 4];
      case 'wall': return ['wall', f % 3];
      case 'climb': return ['wall', Math.abs(s.vy) > 1 ? f % 3 : 0];
      case 'death': return ['death', Math.min(6, f)];
    }
    return ['idle', 14];
  }

  function drawPlayer(ctx, s, camX, camY, pass, flash) {
    const [name, idx] = playerFrame(s);
    const sh = SHEETS[pass === 'visor' ? name + 'V' : name];
    const fx = Math.round(s.x + 2.5 - camX), fy = Math.round(s.y + s.h - camY);
    const flip = s.st === 'wall' ? s.wdir < 0 : s.st === 'climb' ? s.face > 0 : s.face < 0;
    drawFrame(ctx, sh, idx, fx, fy, flip);
    if (pass === 'body' && flash > 0.02) {
      // white-hot flash while burning: draw the sprite again as a white silhouette
      ctx.globalAlpha = Math.min(0.85, flash);
      ctx.globalCompositeOperation = 'lighter';
      drawFrame(ctx, SHEETS[name], idx, fx, fy, flip);
      ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
    }
  }

  function drawTether(ctx, c, s, camX, camY, time) {
    const sh = SHEETS.tether;
    const active = c.i <= s.cp;
    let idx;
    if (!active) idx = 0 + Math.floor(time * 3) % 2 * 0;
    else {
      const t = (Gm_timeSince(c.i) || 99);
      idx = t < 6 * 0.083 * 3 ? 2 + Math.floor(t / (0.083 * 3)) : 8 + Math.floor(time * 12) % 16;
    }
    drawFrame(ctx, sh, idx, Math.round(c.x - camX), Math.round(c.y - camY), false);
  }
  let tetherT = {};
  function Gm_timeSince(i) { return tetherT[i]; }
  function markTether(i, time) { tetherT[i] = 0; tetherT['_' + i] = time; }
  function tickTethers(dt) { for (const k in tetherT) if (k[0] !== '_') tetherT[k] += dt; }

  function drawLampCrystal(ctx, w, l, camX, camY, time, post) {
    const x = Math.round(l.x - camX), y = Math.round(l.y - camY);
    const k = Math.max(0.15, l.k);
    if (l.col === 'cap') {                       // a breathing glowcap on its stalk
      if (!post) {
        let dn = 0; const tx = Math.floor(l.x / TS), ty = Math.floor(l.y / TS);
        while (dn < 6 && !D.solidAt(w, tx, ty + dn + 1)) dn++;
        ctx.fillStyle = TH.near; ctx.fillRect(x - 1, y, 3, (dn + 1) * TS - (l.y - ty * TS) + 1);
        ctx.fillStyle = TH.mid; ctx.fillRect(x, y, 1, (dn + 1) * TS - (l.y - ty * TS));
        return;
      }
      const g = Math.min(1, l.k * 1.4);
      ctx.fillStyle = TH.lamp[0]; ctx.fillRect(x - 4, y - 1, 9, 2); ctx.fillRect(x - 3, y - 2, 7, 1); ctx.fillRect(x - 2, y - 3, 5, 1);
      ctx.globalAlpha = 0.25 + 0.75 * g;
      ctx.fillStyle = TH.lamp[1]; ctx.fillRect(x - 3, y - 1, 7, 1); ctx.fillRect(x - 2, y - 2, 5, 1);
      ctx.fillStyle = TH.lamp[2]; ctx.fillRect(x - 1, y - 3, 2, 1); ctx.fillRect(x - 2, y - 2, 1, 1);
      ctx.globalAlpha = 1;
      ctx.fillStyle = TH.near; ctx.fillRect(x - 4, y + 1, 9, 1);
      return;
    }
    if (!post) {
      // vine from the ceiling
      let top = 0; const tx = Math.floor(l.x / TS), ty = Math.floor(l.y / TS);

  /* ------------------------------------------------------------------ the SEEKER companion

  const MINI = [
    '.....r.....',
    '.....a.....',
    '..LLLLLLL..',
    '.LBBBBBBBS.',
    '.BKKKKKKBS.',
    '.BKKKKKKBS.',
    '.BKKKKKKBS.',
    '.BBBBBBBBS.',
    '.BgBBBBgBS.',
    '..SSSSSSS..',

  /* the ten seekers that can wake in the mycelium: each mini takes its colours from the seeker's colorway */

  /* draws the companion; mode: 'on' (eyes), 'off' (dormant battery), 'cool' (recharging bar) */

  /* ------------------------------------------------------------------ particles */

  /* ------------------------------------------------------------------ the whole scene */
  function drawBackground(ctx, w, camX, camY, W, H, time) {

    const depth = Math.max(0, Math.min(1, (camY + H / 2) / (w.H * TS)));
    const top = TH.bgTop, bot = TH.bgBot;
    const r = Math.round(top[0] + (bot[0] - top[0]) * depth), g = Math.round(top[1] + (bot[1] - top[1]) * depth), b = Math.round(top[2] + (bot[2] - top[2]) * depth);

      const oy = Math.round(-(camY * par[i]) % 400) + (i === 0 ? 20 : i === 1 ? 0 : -10);

  function drawFeatures(ctx, w, s, camX, camY, W, H, time, post) {

    /* chord pad: swap voices when the root changes */

        case 'land': this.sfxNoise(t, 0.16, 'lowpass', 600, 120, 0.22 * v, 0.7); this.sfxTone(t, 90, 48, 0.2, 0.18 * v); break;
        case 'step': this.sfxNoise(t, 0.05, 'bandpass', 900 + 400 * this.rnd(), 500, 0.05 * v, 2); break;
        case 'roll': this.sfxNoise(t, 0.36, 'bandpass', 380, 1100, 0.16 * v, 1.6); break;
        case 'wjump': this.sfxNoise(t, 0.1, 'highpass', 1800, 900, 0.10 * v, 1); this.sfxTone(t, 260, 480, 0.14, 0.08 * v, 'triangle'); break;

        }

  /* ------------------------------------------------------------------ live game wrapper */
  const Live = {
    ctx: null, eng: null, started: false, muted: false, timer: null, nextStep: 0, stepN: 0, t0: 0, params: { energy: 0.2, fear: 0 },
    init() {

      const AC = global.AudioContext || global.webkitAudioContext;
      if (!AC) return false;
      try {
        this.ctx = new AC({ latencyHint: 'interactive' });
        this.eng = new Engine(this.ctx, this.ctx.destination, { volume: 0.7 });
        this.eng.setParams(this.ctx.currentTime, { energy: 0.2, fear: 0 });
        this.eng.setRoot(this.ctx.currentTime, 0);
        if (this.themeIdx !== undefined) this.setTheme(this.themeIdx);
        this.started = true;
        this.t0 = this.ctx.currentTime;
        this.stepN = 0; this.nextStep = this.ctx.currentTime + 0.1;
        this.timer = setInterval(() => this.pump(), 30);

    },
    pump() {

      let guard = 0;

        if (this.nextStep < c.currentTime - 0.5) { this.nextStep = c.currentTime + 0.05; }
        this.eng.step(this.nextStep, this.stepN, this.params);
        this.nextStep += STEP; this.stepN++;
      }
    },
    setTheme(i) {
      this.themeIdx = i;
      if (!this.eng) return;

      if (fl === this.eng.fl) return;
      this.eng.fl = fl; const idx = this.eng.rootIdx; this.eng.rootIdx = -1;
      this.eng.setRoot(this.ctx.currentTime + 0.05, Math.max(0, idx));
    },
    setMood(e, rootIdx) {
      if (!this.eng) return;
      this.params.energy = e;
      this.eng.setRoot(this.ctx.currentTime + 0.05, rootIdx);
    },
    update(fear, duck) {
      if (!this.eng) return;
      this.params.fear = fear;
      this.eng.setParams(this.ctx.currentTime, { energy: this.params.energy, fear, duck: this.muted ? 0 : (duck === undefined ? 1 : duck) });
    },
    sfx(name, a) { if (this.eng && !this.muted && this.ctx.state === 'running') this.eng.sfx(name, this.ctx.currentTime + 0.005, a); },
    setPaused(p) { this.paused = p; if (this.ctx) { if (p) this.eng.setParams(this.ctx.currentTime, { energy: this.params.energy, fear: 0, duck: 0.35 }); } },
    toggleMute() { this.muted = !this.muted; if (this.eng) this.eng.master.gain.setTargetAtTime(this.muted ? 0 : 0.7, this.ctx.currentTime, 0.1); return this.muted; },
  };

  /* ------------------------------------------------------------------ offline soundtrack render */
  // arrangement: [seconds, energy, rootIdx]
  const ARRANGEMENT = [[0, 0.12, 0], [24, 0.22, 0], [48, 0.34, 4], [72, 0.46, 2], [96, 0.58, 5], [120, 0.72, 1], [144, 0.86, 3], [168, 1.0, 0], [200, 0.66, 4], [224, 0.30, 0], [248, 0.12, 0]];

    const OAC = global.OfflineAudioContext || global.webkitOfflineAudioContext;
    const rate = sampleRate || 44100;
    const ctx = new OAC(2, Math.floor(seconds * rate), rate);
    const eng = new Engine(ctx, ctx.destination, { offline: true, volume: 0.7, seed: 48 });
    let ai = 0;
    const steps = Math.floor(seconds / STEP);
    let lastParam = -1;

  /* ------------------------------------------------------------ simulation driver */

    if (S_.dead) {
      const k = Math.min(1, S_.deadT / 60) * (S_.deadT > D.C.DEADT - 30 ? Math.max(0, (D.C.DEADT - S_.deadT) / 30) : 1);
      ctx.globalAlpha = k * 0.85; ctx.fillStyle = '#05050a'; ctx.fillRect(0, 0, LW, LH); ctx.globalAlpha = 1;
      if (S_.deadT > 20) { ctx.globalAlpha = Math.min(1, (S_.deadT - 20) / 20) * k; R.drawText(ctx, S_.why === 'void' ? 'THE DARK TOOK YOU' : 'THE LIGHT FOUND YOU', LW >> 1, (LH >> 1) - 4, PAL.muted, 1, 'center'); ctx.globalAlpha = 1; }
    }
    if (S_.ex > 0.04 && !S_.dead) {
      const px = Math.round(S_.x + 2.5 - camX), py = Math.round(S_.y - 7 - camY);
      drawBar(ctx, px - 8, py, 16, 2, Math.min(1, S_.ex), S_.ex > 0.7 ? '#e8e0d0' : '#a9c4d2');
    }
    if (cardT < 4.5 && mode === 'play' && seekerCardT > 6.5) {
      const a = Math.min(1, cardT / 0.8) * Math.min(1, (4.5 - cardT) / 1.0);
      ctx.globalAlpha = a * 0.9;
      R.drawText(ctx, cardText, LW >> 1, Math.round(LH * 0.22), PAL.snow, 2, 'center');
      ctx.globalAlpha = 1;
    }
    // the companion's charge (top left)
    if (S_.cmp && mode !== 'win') {
      const x = 12, y = Math.round(44 / SC) + 3;
      const ready = S_.cmp === 1 && S_.cmpCD === 0;
      ctx.globalAlpha = ready ? 0.9 : 0.55;
      R.drawMini(ctx, x, y + 2, gameTime, ready ? 'on' : 'cool', 1, 1 - S_.cmpCD / D.C.CMPCD);
      R.drawText(ctx, touchMode ? 'SEEK' : 'E', x + 9, y - 1, ready ? '#9fd3c7' : '#4b5f63', 1, 'left');
      ctx.globalAlpha = 1;
    }
    if (seekerCardT < 6.5) {
      const a = Math.min(1, seekerCardT / 0.6) * Math.min(1, (6.5 - seekerCardT) / 1.0);
      const cy = Math.round(LH * 0.32);
      ctx.globalAlpha = a * 0.75; ctx.fillStyle = '#05070b'; ctx.fillRect(0, cy - 34, LW, 78); ctx.globalAlpha = a;
      R.drawPortrait(ctx, LW / 2 - 60, cy + 4, 1, a);
      ctx.globalAlpha = a;
      R.drawText(ctx, 'A SEEKER WAKES', LW / 2 - 20, cy - 16, PAL.snow, 2, 'left');
      R.drawText(ctx, 'SEEKER NET  #' + R.seekerId + '  FOLLOWS YOU NOW', LW / 2 - 20, cy + 6, '#9fd3c7', 1, 'left');
      R.drawText(ctx, touchMode ? 'TAP SEEK  -  IT COVERS THE NEAREST LIGHT' : 'PRESS E  -  IT COVERS THE NEAREST LIGHT', LW / 2 - 20, cy + 18, PAL.gold, 1, 'left');
      R.drawText(ctx, 'FOR A FEW BEATS', LW / 2 - 20, cy + 28, '#8a919e', 1, 'left');
      ctx.globalAlpha = 1;
    }
    if (mode === 'play') {
      ctx.globalAlpha = 0.5;
      if (touchMode) R.drawText(ctx, fmtTime(runTicks / D.TICK), LW >> 1, Math.round(44 / SC), PAL.muted, 1, 'center');
      else R.drawText(ctx, fmtTime(runTicks / D.TICK), LW - 6, Math.round(44 / SC), PAL.muted, 1, 'right');
      ctx.globalAlpha = 1;
    }
    if (mode === 'pause') {
      ctx.fillStyle = 'rgba(5,5,10,0.7)'; ctx.fillRect(0, 0, LW, LH);
      R.drawText(ctx, touchMode ? 'TAP HERE  -  MAP' : 'Q  MAP', LW >> 1, Math.round(LH * 0.16), '#8a919e', 1, 'center');
      R.drawText(ctx, ROMAN[cur] + '  ' + NAMES[cur], LW >> 1, (LH >> 1) - 36, '#8a919e', 1, 'center');
      R.drawText(ctx, 'PAUSED', LW >> 1, (LH >> 1) - 22, PAL.snow, 2, 'center');
      R.drawText(ctx, touchMode ? 'TAP TO RESUME' : 'ESC  RESUME', LW >> 1, (LH >> 1) + 2, PAL.gold, 1, 'center');
      R.drawText(ctx, touchMode ? 'TAP LOWER SCREEN  NEW DESCENT' : 'N  NEW DESCENT', LW >> 1, (LH >> 1) + 44, PAL.snow, 1, 'center');
      R.drawText(ctx, 'TIME  ' + fmtTime(runTicks / D.TICK) + '    DEATHS  ' + S_.deaths, LW >> 1, (LH >> 1) + 16, PAL.muted, 1, 'center');
      R.drawText(ctx, 'M  MUTE   F  FULLSCREEN   R  RETURN TO TETHER', LW >> 1, (LH >> 1) + 30, PAL.stone4, 1, 'center');
    }
    if (mode === 'win') {
      const a = Math.min(1, Math.max(0, (winT - 1.2) / 1.5));
      ctx.globalAlpha = a * 0.55; ctx.fillStyle = '#05050a'; ctx.fillRect(0, 0, LW, LH); ctx.globalAlpha = a;
      const y0 = Math.round(LH * 0.18);
      R.drawText(ctx, 'A SLIVER OF THE CRYSTAL', LW >> 1, y0, R.SHARDS[cur], 2, 'center');
      R.drawText(ctx, ROMAN[cur] + '  ' + NAMES[cur] + '  COMPLETE', LW >> 1, y0 + 22, PAL.gold, 1, 'center');
      const t = winTime;
      R.drawText(ctx, 'TIME  ' + fmtTime(t) + (newBest ? '  NEW BEST' : '') + '     LIGHT FOUND YOU  ' + S_.deaths + ' TIMES', LW >> 1, y0 + 36, PAL.snow, 1, 'center');
      R.drawGem(ctx, LW >> 1, y0 + 70, 0.9, P.beaten, gameTime, count() >= NL);
      R.drawText(ctx, count() + ' OF 6 SLIVERS', LW >> 1, y0 + 92, '#a9b2c0', 1, 'center');
      if (winT > 2.5) { ctx.globalAlpha = a * (0.55 + 0.45 * Math.sin(winT * 3)); R.drawText(ctx, touchMode ? 'TAP FOR THE MAP' : 'ENTER  MAP     N  AGAIN', LW >> 1, y0 + 108, PAL.gold, 1, 'center'); }
      ctx.globalAlpha = 1;
    }
  }

  function showError(msg) {
    const el = document.getElementById('err');
    if (el) { el.style.display = 'block'; el.textContent = 'Dweller hit a snag:\n' + msg.slice(0, 600) + '\n\nTry reloading the page.'; }
  }

  /* ------------------------------------------------------------ boot */
  async function boot() {
    resize();
    canvas.tabIndex = 0; canvas.style.outline = 'none'; grabFocus();
    buildTouchUI();
    loadProgress();
    const q = new URLSearchParams(location.search);
    try {
      await R.load(window.DWELLER_ASSETS);
      pickSeeker();
      loadLevel(0);
      S = D.newState(world); snapCamera();
    } catch (e) { showError(String(e && e.stack || e)); console.error(e); return; }
    const ld = document.getElementById('loading'); if (ld) ld.remove();
    mode = 'title'; titleT = 0;
    // the map opens on the deepest level you can play
    sel = 0; for (let i = 0; i < NL; i++) if (built(i) && unlocked(i)) sel = i;
    if (q.get('speed')) speedMul = Math.max(1, Math.min(32, parseFloat(q.get('speed')) || 1));
    lastT = performance.now();
    requestAnimationFrame(frame);
    // debug / test hooks
    window.__dweller = {
      get state() { return S; }, get world() { return world; }, get mode() { return mode; }, get level() { return cur; }, get progress() { return P; },
      start(fresh) { startLevel(cur < 0 ? 0 : cur, !!fresh); },
      startLevel(i, fresh) { startLevel(i, fresh === undefined ? true : !!fresh); },
      map() { toMap(); },
      setProgress(o) { Object.assign(P, o); saveProgress(); },
      replay(inputs, speed) { replay = inputs; replayI = 0; speedMul = speed || 1; },
      setSpeed(v) { speedMul = v; },
      teleport(x, y) { S.x = x; S.y = y; snapCamera(); },
      shot() { return canvas.toDataURL('image/png'); },
      get ticks() { return runTicks; },
    };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
</body></html>
